name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit SHA to build. Empty builds the ref selected above."
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Trigger release only if the tag matches the pattern 'vX.Y.Z'.
  # Any other tag will only build but not trigger release.
  tag-check:
    name: Classify tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    outputs:
      is_release: ${{ steps.classify.outputs.is_release }}
    steps:
      - id: classify
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "$TAG is a release tag - Build job with trigger a published release."
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG is NOT a release tag - building only, no release."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

  build-ui:
    uses: ./.github/workflows/build-ui.yml
    with:
      ref: ${{ inputs.ref }}

  build:
    name: Build (${{ matrix.distro.name }})
    runs-on: ubuntu-latest
    needs: build-ui
    strategy:
      fail-fast: false
      matrix:
        distro:
          # - { name: "ubuntu", image: "ubuntu:latest", suffix: "linux-ubuntu-amd64" }
          - { name: "debian", image: "debian:latest", suffix: "linux-amd64", python_dist: true }

    container:
      image: ${{ matrix.distro.image }}

    env:
      BIN_NAME: icon

    steps:
      - name: Install system deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            openssh-client git ca-certificates curl binutils gh

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync build dependencies
        run: |
          uv sync --locked --no-dev --extra server --group build

      - name: Download UI assets
        uses: actions/download-artifact@v4
        with:
          name: ui-assets
          path: src/icon/server

      - name: Build sdist & wheel
        if: matrix.distro.python_dist
        run: uv build

      - name: Upload sdist & wheel
        if: matrix.distro.python_dist
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: |
            dist/*.tar.gz
            dist/*.whl
          if-no-files-found: error

      - name: Build binary with PyInstaller
        run: uv run pyinstaller icon.spec

      - name: Package binary
        run: |
          mkdir -p out
          cp "dist/${BIN_NAME}" "out/${BIN_NAME}-${{ matrix.distro.suffix }}"
          chmod +x "out/${BIN_NAME}-${{ matrix.distro.suffix }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro.suffix }}
          path: out/*

      - name: Summary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### Distributables from ${{ matrix.distro.name }}"
            echo
            echo "| artifact | size |"
            echo "| --- | ---: |"
            for artifact in out/* dist/*.tar.gz dist/*.whl; do
              [ -f "$artifact" ] || continue
              echo "| \`$(basename "$artifact")\` | $(du -h "$artifact" | cut -f1) |"
            done
            echo
            if [[ "${{ github.ref }}" == refs/tags/* && "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "🚀 Publish as release \`$TAG\` 🚀"
            else
              echo "The tag \`$TAG\` is not a release tag (\`vX.Y.Z\`); the files stay workflow artifacts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create release & upload binaries
    runs-on: ubuntu-latest
    needs: [build, tag-check]
    permissions:
      contents: write
    if: needs.tag-check.outputs.is_release == 'true'
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist_out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist_out/icon-linux-*
            dist_out/icon-*.tar.gz
            dist_out/icon-*.whl
          generate_release_notes: true
