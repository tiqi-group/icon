---
name: Python lints

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - parallel:
          - name: ruff
            env:
              UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv-ruff
            run: |
              uv run --only-group dev --locked ruff check
              uv run --only-group dev --locked ruff format --check

          - name: mypy
            env:
              UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv-mypy
              MYPY_TEXT_REPORTS: ${{ runner.temp }}/mypy-text
              MYPY_HTML_REPORT: ${{ runner.temp }}/mypy-html
            run: |
              uv sync --extra server --extra client --locked
              rc=0
              uv run --no-sync mypy \
                --lineprecision-report "$MYPY_TEXT_REPORTS" \
                --any-exprs-report "$MYPY_TEXT_REPORTS" \
                --html-report "$MYPY_HTML_REPORT" || rc=$?

              for report in "$MYPY_TEXT_REPORTS"/*.txt; do
                [ -f "$report" ] || continue
                echo "::group::mypy report: $(basename "$report")"
                cat "$report"
                echo "::endgroup::"
              done
              exit $rc

      - name: Upload mypy HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-html-report
          path: ${{ runner.temp }}/mypy-html
