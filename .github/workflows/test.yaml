---
name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-assets:
    uses: ./.github/workflows/build-ui.yml

  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ui-assets
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download UI assets
        uses: actions/download-artifact@v4
        with:
          name: ui-assets
          path: src/icon/server

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra server --extra client --locked
      - name: Full Python tests
        run: uv run pytest -v -m "not container"
