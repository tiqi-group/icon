---
name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1
        with:
          runtime: node@22
          working-directory: frontend
          cache: true
          require-lockfile: true

      - name: Build UI assets
        working-directory: frontend
        run: pnpm run build

      - name: Upload UI assets
        uses: actions/upload-artifact@v4
        with:
          name: ui-assets
          path: |
            src/icon/server/frontend
            src/icon/server/frontend_visualizer
          if-no-files-found: error

  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: ui-assets
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Download UI assets
        uses: actions/download-artifact@v4
        with:
          name: ui-assets
          path: src/icon/server

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra server --extra client --locked
      - name: Full Python tests
        run: uv run pytest -v -m "not container"
